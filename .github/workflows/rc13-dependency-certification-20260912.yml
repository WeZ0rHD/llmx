name: RC13 Dependency Certification 2026-09-12

on:
  push:
    branches:
      - ci/account-runner-probe-20260912
    paths:
      - ".github/workflows/rc13-dependency-certification-20260912.yml"
      - ".ci/rc13-package.json"
      - ".ci/rc13-deps-trigger.txt"

permissions:
  contents: read

jobs:
  certify-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Pin npm 11.6.0
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.6.0
          test "$(npm --version)" = "11.6.0"

      - name: Prepare exact RC13 dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc13-deps"
          cp .ci/rc13-package.json "$RUNNER_TEMP/rc13-deps/package.json"
          cd "$RUNNER_TEMP/rc13-deps"
          test "$(node -p "require('./package.json').version")" = "1.0.0-rc.13"

      - name: Resolve canonical lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc13-deps"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -f package-lock.json
          test "$(node -p "require('./package-lock.json').lockfileVersion")" = "3"
          sha256sum package-lock.json | tee package-lock-sha256.txt

      - name: Clean npm ci
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc13-deps"
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0 | tee npm-ls-depth0.txt

      - name: Verify exact direct versions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc13-deps"
          node <<'NODE' | tee direct-version-verification.txt
          const fs = require("node:fs");
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          const expected = {...pkg.dependencies, ...pkg.devDependencies};
          let bad = 0;
          for (const [name, version] of Object.entries(expected)) {
            const root = lock.packages[""]?.dependencies?.[name] ?? lock.packages[""]?.devDependencies?.[name];
            const resolved = lock.packages["node_modules/"+name]?.version;
            const installed = require("./node_modules/"+name+"/package.json").version;
            const ok = root === version && resolved === version && installed === version;
            console.log((ok ? "PASS" : "FAIL"), name, "expected="+version, "root="+root, "lock="+resolved, "installed="+installed);
            if (!ok) bad++;
          }
          const sucrase = lock.packages["node_modules/sucrase"]?.version;
          console.log(sucrase === "3.35.1" ? "PASS" : "FAIL", "sucrase override", sucrase);
          if (sucrase !== "3.35.1") bad++;
          if (bad) process.exit(1);
          NODE

      - name: Global dependency audit moderate+
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc13-deps"
          set +e
          npm audit --audit-level=moderate --json > npm-audit-all.json
          code=$?
          set -e
          node -e 'const a=require("./npm-audit-all.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))'
          test "$code" -eq 0

      - name: Production dependency audit high+
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc13-deps"
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit-production.json
          code=$?
          set -e
          node -e 'const a=require("./npm-audit-production.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))'
          test "$code" -eq 0

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc13-dependency-certification-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rc13-deps/package.json
            ${{ runner.temp }}/rc13-deps/package-lock.json
            ${{ runner.temp }}/rc13-deps/package-lock-sha256.txt
            ${{ runner.temp }}/rc13-deps/npm-ls-depth0.txt
            ${{ runner.temp }}/rc13-deps/direct-version-verification.txt
            ${{ runner.temp }}/rc13-deps/npm-audit-all.json
            ${{ runner.temp }}/rc13-deps/npm-audit-production.json
