name: RC13 Offline Runtime Bundle 2026-09-12

on:
  push:
    branches:
      - ci/account-runner-probe-20260912
    paths:
      - ".github/workflows/rc13-offline-runtime-bundle-20260912.yml"
      - ".ci/rc13-package.json"
      - ".ci/rc13-runtime-bundle-trigger.txt"

permissions:
  contents: read

jobs:
  bundle-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Pin npm 11.6.0
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.6.0
          test "$(npm --version)" = "11.6.0"

      - name: Prepare exact dependency root and lockfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc13-runtime"
          cp .ci/rc13-package.json "$RUNNER_TEMP/rc13-runtime/package.json"
          cd "$RUNNER_TEMP/rc13-runtime"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "9fd629a22bc26297f05715b6738e63118b593d9135b4d677913da5751e85cfcd"

      - name: Clean npm ci with package scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc13-runtime"
          rm -rf node_modules
          npm ci --no-audit --no-fund
          npm ls --depth=0 | tee npm-ls-depth0.txt
          node -e 'console.log("typescript",require("./node_modules/typescript/package.json").version); console.log("next",require("./node_modules/next/package.json").version); console.log("vitest",require("./node_modules/vitest/package.json").version); console.log("playwright",require("./node_modules/@playwright/test/package.json").version)'
          du -sh node_modules

      - name: Build deterministic-ish transport archive
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rc13-runtime"
          tar --zstd -cf node_modules-linux-x64-node22.16-npm11.6.tar.zst node_modules
          sha256sum node_modules-linux-x64-node22.16-npm11.6.tar.zst > node-modules-sha256.txt
          ls -lh node_modules-linux-x64-node22.16-npm11.6.tar.zst
          cat node-modules-sha256.txt

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: rc13-offline-runtime-bundle-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/rc13-runtime/node_modules-linux-x64-node22.16-npm11.6.tar.zst
            ${{ runner.temp }}/rc13-runtime/node-modules-sha256.txt
            ${{ runner.temp }}/rc13-runtime/package-lock.json
            ${{ runner.temp }}/rc13-runtime/npm-ls-depth0.txt
